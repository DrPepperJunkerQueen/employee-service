services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-data-service-db
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees_app
      POSTGRES_PASSWORD: employees_app_password
    ports:
      - "5432:5432"
    volumes:
      - employee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees_app -d employees"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  employee_pgdata:
